name: Perf baseline

# The before/after numbers of the performance work
# (docs/리팩토링-성능-위생-계획.md): engine-line allocation, the board view
# model's per-line cost, the board screen's recompositions, and the Compose
# compiler's stability reports. The *BaselineTest classes measure only when
# ZENYTH_PERF_OUT is set, which only this workflow does; they assert nothing.
#
# Counts are the numbers to compare. Times are a runner's and vary run to run.

on:
  push:
    branches: ['refactor/**']
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - '.github/workflows/perf-baseline.yml'
  workflow_dispatch:

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Baseline tests
        env:
          ZENYTH_PERF_OUT: ${{ github.workspace }}/perf
          ZENYTH_JFR_DIR: ${{ github.workspace }}/jfr
        run: >
          ./gradlew testDebugUnitTest --rerun --tests '*BaselineTest*'
          --stacktrace

      # Where the measured stretches allocate (PerfBaseline.profiled), charged
      # to the first frame of the app's own code.
      - name: Allocation profiles
        run: |
          for f in jfr/*.jfr; do
            name=$(basename "$f" .jfr)
            "$JAVA_HOME/bin/jfr" print --json --events jdk.ObjectAllocationSample "$f" > "jfr/$name.json"
            python3 .github/scripts/alloc_top.py "jfr/$name.json" > "perf/alloc_$name.txt"
          done

      # The report folders are not inputs of the compile task, so without
      # --rerun it comes back UP-TO-DATE and writes nothing.
      - name: Compose compiler reports
        run: ./gradlew compileDebugKotlin --rerun -PcomposeReports --stacktrace

      - name: Summary
        if: always()
        run: |
          {
            echo '```'
            cat perf/*.txt 2>/dev/null || echo 'no baseline output'
            echo
            for f in app/build/compose_metrics/*-module.json; do [ -f "$f" ] && cat "$f"; done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat perf/*.txt 2>/dev/null || true

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-baseline
          path: |
            perf/
            app/build/compose_reports/
            app/build/compose_metrics/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn

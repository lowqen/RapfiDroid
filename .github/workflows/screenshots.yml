name: Screenshots

# The design-system goldens (docs/UI-개편-마스터플랜.md, P0).
#
#  - push: verify against app/src/test/screenshots — any pixel that moved fails
#    the run, and the diff images are uploaded so the change can be looked at.
#  - workflow_dispatch with mode=record: write fresh goldens and upload them.
#    Download the artifact into app/src/test/screenshots/ and commit it; that is
#    how an intended visual change is accepted.
#
# Goldens are made here and only here: a font rasterised on another machine is
# a different picture, and a golden is only as good as the machine checking it.

on:
  push:
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - '.github/workflows/screenshots.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'record (write goldens) or verify'
        required: true
        default: verify
        type: choice
        options: [verify, record]

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    # A normal run takes about five minutes; a hung capture should fail, not run on.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Choose mode
        id: mode
        run: |
          mode="${{ github.event.inputs.mode || 'verify' }}"
          # Nothing to verify against before the first record.
          if [ "$mode" = verify ] && ! ls app/src/test/screenshots/*.png >/dev/null 2>&1; then
            mode=none
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Screenshot tests (${{ steps.mode.outputs.mode }})
        if: steps.mode.outputs.mode != 'none'
        run: >
          ./gradlew testDebugUnitTest --tests '*ScreenshotTest*'
          -Pscreenshots=${{ steps.mode.outputs.mode }} --stacktrace

      - name: Upload goldens
        if: steps.mode.outputs.mode == 'record'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: app/src/test/screenshots/*.png
          if-no-files-found: error

      - name: Upload diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshot-diffs
          path: |
            app/build/outputs/roborazzi/
            app/build/reports/tests/testDebugUnitTest/

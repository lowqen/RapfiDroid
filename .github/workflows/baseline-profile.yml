name: Baseline profile

# Records the app's Baseline Profile (docs/리팩토링-성능-위생-계획.md, Phase 7-2)
# on an emulator and keeps it as an artifact. Commit it as
# app/src/main/baseline-prof.txt; AGP compiles it into every release APK, where
# ProfileInstaller hands it to ART at install. Run by hand after a change to what
# the app does at start-up - the profile goes stale slowly, and an old one only
# helps less, it never breaks anything.

on:
  workflow_dispatch:
  # Also when the generator itself changes on a refactor branch: a workflow can
  # be started by hand only once it is on main.
  push:
    branches: ['refactor/**']
    paths:
      - 'baselineprofile/**'
      - '.github/workflows/baseline-profile.yml'

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      # The emulator needs hardware acceleration, which the runner has but does
      # not open to the runner user.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build the app and the generator
        run: ./gradlew :app:assembleBenchmark :baselineprofile:assembleBenchmark -PbaselineProfile --stacktrace

      - name: Record on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # API 34 images write no profile when asked to flush ("never flushed
          # profiles"); 33 is the usual stand-in for recording.
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          # A rooted shell, so the profiler can make the app write its profile
          # out; the alternative, <profileable> in the app's manifest, would
          # change the shipped app for a build-time tool.
          script: |
            adb root
            adb wait-for-device
            ./gradlew :baselineprofile:connectedBenchmarkAndroidTest -PbaselineProfile -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=BaselineProfile --stacktrace

      - name: Collect the profile
        run: |
          mkdir -p profile
          find baselineprofile/build -name '*-baseline-prof.txt' -exec cp {} profile/ \;
          find baselineprofile/build -name '*-startup-prof.txt' -exec cp {} profile/ \;
          ls -la profile
          test -n "$(ls profile/*-baseline-prof.txt 2>/dev/null)"

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: baseline-profile
          path: |
            profile/
            baselineprofile/build/outputs/
          if-no-files-found: warn

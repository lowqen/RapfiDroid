name: Build debug APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      # Every runner is a fresh machine, and AGP makes a new debug key on each
      # one: two CI builds were signed by two different keys, so a phone
      # refused to update one with the other (INSTALL_FAILED_UPDATE_INCOMPATIBLE)
      # and only uninstalling first worked. The key is fixed in a secret, not in
      # the repo (keystores never go into git). Without the secret the build
      # still runs, on a throwaway key as before.
      - name: Fixed debug signing key
        env:
          DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}
        run: |
          if [ -n "$DEBUG_KEYSTORE" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE" | base64 -d > ~/.android/debug.keystore
            echo "debug key: fixed (secret)"
          else
            echo "debug key: throwaway (no DEBUG_KEYSTORE secret)"
          fi

      # The repo carries 43 unit-test classes — the engine grammar, the pack
      # readers, the position keys, the settings codec. Building without running
      # them proves only that the code compiles.
      #
      # Nothing here needs the RenjuNet data: the tests that would (the deployed
      # pack smoke test) guard themselves with `assumeTrue` and skip when the
      # packs are absent, which they always are on a runner.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-report
          path: app/build/reports/tests/testDebugUnitTest/

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      # The release build shrinks with R8 (Phase 7-1 of
      # docs/리팩토링-성능-위생-계획.md). It runs here on every push, unsigned, so
      # a keep rule that is missing fails the build here and not on a release
      # day; and the engine's binaries and weights inside it are checked against
      # the repo byte for byte - shrinking must never reach the engine.
      - name: Assemble release APK (R8)
        run: ./gradlew assembleRelease --stacktrace

      - name: Engine files untouched
        run: python3 .github/scripts/check_engine_files.py app/build/outputs/apk/release/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

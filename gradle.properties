# Sized for the machine this is built on: 4 GB of RAM, most of it already spoken
# for. A release build runs three JVMs at once — the Gradle daemon, the Kotlin
# daemon and AGP's workers — so the numbers below are deliberately small.
# Asking for more heap than the machine can host does not make the build faster,
# it makes Windows page and then refuse file operations:
# `transformReleaseClassesWithAsm` copies thousands of .class files one at a
# time and fails with ERROR_NO_SYSTEM_RESOURCES ("시스템 리소스가 부족하기
# 때문에 요청한 서비스를 완성할 수 없습니다") long before any JVM reports an
# OutOfMemoryError. On a machine with more memory these can go back up —
# nothing here is a correctness setting.
org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8

# The Kotlin compiler runs in a JVM of its own and, left alone, sizes itself
# from the Gradle daemon's heap — a second process as large as the first.
kotlin.daemon.jvmargs=-Xmx900m -Dfile.encoding=UTF-8

# One module, so parallel execution buys nothing and costs a worker JVM.
org.gradle.parallel=false
org.gradle.workers.max=2

# The file-system watcher holds a handle on every directory it watches, which is
# the resource this build ran out of.
org.gradle.vfs.watch=false

org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
